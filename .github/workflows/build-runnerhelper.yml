name: Build Runner APK

on:
  push:
    branches:
      - runnerhelper-build-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk RunnerHelper_V0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunnerHelper_V0.1.1
          path: RunnerHelper_V0.1.1.apk
          if-no-files-found: error
